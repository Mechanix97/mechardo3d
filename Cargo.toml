[package]
name = "mechardo3d"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3.19"
tera = "1.20"
mime_guess = "2.0"
rand = "0.9.2"
reqwest = { version = "0.12", features = ["json"] }
askama = "0.14"
