<!DOCTYPE html>
<html lang="es" class="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Mechardo Labs</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
    <link rel="icon" type="image/x-icon" href="/static/images/favicon/favicon.ico">
</head>

<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
    <button id="theme-toggle" aria-label="Toggle dark mode"
        class="fixed bottom-4 right-4 p-2 bg-blue-500 text-white rounded-full hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <svg id="theme-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">
            <path id="sun" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
            </path>
            <path id="moon" class="hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
        </svg>
    </button>
    <nav class="bg-gray-800 dark:bg-gray-800 p-4">
        <ul class="flex justify-center gap-4">
            <li><a href="/" class="text-white hover:underline font-bold">Inicio</a></li>
            <li><a href="/products" class="text-white hover:underline font-bold">Productos</a></li>
            <li><a href="/blog" class="text-white hover:underline font-bold">Blog</a></li>
            <li><a href="/contact" class="text-white hover:underline font-bold">Contacto</a></li>
        </ul>
    </nav>
    <main class="w-auto mx-auto p-4">
        {% block content %}
        {% endblock %}
    </main>
    <script src="/static/js/theme-toggle.js"></script>
</body>

</html>
