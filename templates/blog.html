{% extends "base.html" %}
{% import "macros/cards.html" as cards %}
{% block content %}
<div class="container mx-auto px-4 py-12 max-w-5xl">
    <h1 class="text-4xl md:text-5xl font-extrabold bg-gradient-to-r from-blue-600 to-violet-600 dark:from-blue-400 dark:to-violet-400 bg-clip-text text-transparent mb-10 text-center">{{ t.blog.title }}
    </h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        {% for post in posts %}
        {{ cards::post_card(post=post, lang=lang, t=t, level="h2") }}
        {% endfor %}
    </div>
</div>
{% endblock %}
