{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-12 max-w-4xl text-center">
    <h1 class="text-4xl md:text-5xl font-extrabold bg-gradient-to-r from-blue-600 to-violet-600 dark:from-blue-400 dark:to-violet-400 bg-clip-text text-transparent mb-6">{{ t.contact_success.title }}</h1>
    <p class="text-lg text-gray-700 dark:text-gray-200 mb-8">{{ t.contact_success.message }}</p>
    <a href="/{{ lang | default(value='es') }}/contact" class="btn-primary">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        {{ t.contact_success.back }}
    </a>
</div>
{% endblock %}
