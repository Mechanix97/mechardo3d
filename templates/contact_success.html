{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-12 max-w-4xl text-center">
    <h1 class="text-4xl md:text-5xl font-extrabold text-blue-600 dark:text-blue-300 mb-6">{{ t.contact_success.title }}</h1>
    <p class="text-lg text-gray-700 dark:text-gray-200 mb-8">{{ t.contact_success.message }}</p>
    <a href="/{{ lang | default(value='es') }}/contact"
        class="inline-flex items-center gap-2 px-6 py-3 bg-blue-500 text-white rounded-lg shadow-md hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-700 transition-all duration-300 transform hover:scale-105 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        {{ t.contact_success.back }}
    </a>
</div>
{% endblock %}
