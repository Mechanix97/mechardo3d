{% extends "base.html" %}
{% block content %}
<section class="wrap">
    <div class="ruler"><span>§ {{ t.nav.contact }}</span><span>OK</span></div>
    <div class="flex flex-col items-start gap-5 py-16 md:py-28">
        <p class="flex items-center gap-3 font-mono text-xs tracking-[0.1em] text-lime uppercase"><span class="led" aria-hidden="true"></span>200 OK</p>
        <h1 class="text-[2.75rem] leading-[0.95] font-semibold tracking-[-0.04em] md:text-[5rem]">{{ t.contact_success.title }}</h1>
        <p class="max-w-xl text-base leading-relaxed text-muted md:text-lg">{{ t.contact_success.message }}</p>
        <a href="/{{ lang | default(value='es') }}/contact" class="btn-line mt-4">← {{ t.contact_success.back }}</a>
    </div>
</section>
{% endblock %}
