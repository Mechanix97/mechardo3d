{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-20 max-w-3xl text-center">
    <p class="text-7xl md:text-8xl font-extrabold text-blue-700 dark:text-blue-300 mb-4">404</p>
    <h1 class="text-3xl md:text-4xl font-bold text-gray-800 dark:text-gray-100 mb-4">{{ t.errors.not_found_title }}</h1>
    <p class="text-lg text-gray-600 dark:text-gray-300 mb-10">{{ t.errors.not_found_message }}</p>
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a href="/{{ lang }}" class="btn-primary">{{ t.errors.back_home }}</a>
        <a href="/{{ lang }}/blog" class="btn-outline">{{ t.blog.title }}</a>
    </div>
</div>
{% endblock %}
