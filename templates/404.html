{% extends "base.html" %}
{% block content %}
<section class="wrap">
    <div class="ruler"><span>§ Error</span><span>HTTP 404</span></div>
    <div class="flex flex-col items-start gap-5 py-16 md:py-28">
        <p class="font-mono text-[5.5rem] leading-none font-semibold tracking-tight text-lime md:text-[10rem]" aria-hidden="true">404</p>
        <h1 class="text-3xl font-semibold tracking-tight md:text-5xl">{{ t.errors.not_found_title }}</h1>
        <p class="max-w-xl text-base leading-relaxed text-muted md:text-lg">{{ t.errors.not_found_message }}</p>
        <div class="mt-4 flex w-full flex-col gap-2.5 sm:w-auto sm:flex-row sm:gap-0">
            <a href="/{{ lang }}" class="btn-lime">{{ t.errors.back_home }}</a>
            <a href="/{{ lang }}/blog" class="btn-line sm:border-l-0">{{ t.blog.title }}</a>
        </div>
    </div>
</section>
{% endblock %}
