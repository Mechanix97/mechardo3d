{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-12 max-w-4xl">
    <!-- Título y mensaje introductorio -->
    <h1 class="text-4xl md:text-5xl font-extrabold text-blue-600 dark:text-blue-300 mb-6 text-center leading-tight">{{ t.contact.title }}</h1>
    <p class="text-lg text-gray-700 dark:text-gray-200 mb-12 text-center">{{ t.contact.intro }}</p>

    <!-- Canales de contacto -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mb-12">
        <!-- Email -->
        <a href="mailto:mechardo.labs@gmail.com" aria-label="{{ t.contact.email.aria }}"
            class="flex items-center gap-3 p-4 bg-white dark:bg-gray-800 rounded-lg shadow-md hover:shadow-xl hover:bg-blue-50 dark:hover:bg-blue-900 transition-all duration-300 transform hover:scale-105">
            <svg class="w-6 h-6 text-blue-700 dark:text-blue-300" fill="currentColor" viewBox="0 0 24 24"
                aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
            </svg>
            <span class="text-lg font-semibold text-blue-700 dark:text-blue-300">{{ t.contact.email.label }}</span>
        </a>
        <!-- Twitter (X) -->
        <a href="https://x.com/MechardoLabs" target="_blank" rel="noopener noreferrer" aria-label="{{ t.social.x.aria }}"
            class="flex items-center gap-3 p-4 bg-white dark:bg-gray-800 rounded-lg shadow-md hover:shadow-xl hover:bg-blue-50 dark:hover:bg-blue-900 transition-all duration-300 transform hover:scale-105">
            <svg class="w-6 h-6 text-blue-700 dark:text-blue-300" fill="currentColor" viewBox="0 0 24 24"
                aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
            </svg>
            <span class="text-lg font-semibold text-blue-700 dark:text-blue-300">X</span>
        </a>
        <!-- Instagram -->
        <a href="https://www.instagram.com/mechardo3d/" target="_blank" rel="noopener noreferrer" aria-label="{{ t.social.instagram.aria }}"
            class="flex items-center gap-3 p-4 bg-white dark:bg-gray-800 rounded-lg shadow-md hover:shadow-xl hover:bg-blue-50 dark:hover:bg-blue-900 transition-all duration-300 transform hover:scale-105">
            <svg class="w-6 h-6 text-blue-700 dark:text-blue-300" fill="currentColor" viewBox="0 0 24 24"
                aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M7 2C4.2 2 2 4.2 2 7v10c0 2.8 2.2 5 5 5h10c2.8 0 5-2.2 5-5V7c0-2.8-2.2-5-5-5H7zm10 2c1.7 0 3 1.3 3 3v10c0 1.7-1.3 3-3 3H7c-1.7 0-3-1.3-3-3V7c0-1.7 1.3-3 3-3h10zm-5 3a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6zm4.5-.9a1.1 1.1 0 100 2.2 1.1 1.1 0 000-2.2z" />
            </svg>
            <span class="text-lg font-semibold text-blue-700 dark:text-blue-300">Instagram</span>
        </a>
        <!-- Discord -->
        <a href="https://discord.gg/VtbFAGJe86" target="_blank" rel="noopener noreferrer" aria-label="{{ t.social.discord.aria }}"
            class="flex items-center gap-3 p-4 bg-white dark:bg-gray-800 rounded-lg shadow-md hover:shadow-xl hover:bg-blue-50 dark:hover:bg-blue-900 transition-all duration-300 transform hover:scale-105">
            <svg class="w-6 h-6 text-blue-700 dark:text-blue-300" fill="currentColor" viewBox="0 0 24 24"
                aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.376-.444.753-.608 1.15a18.566 18.566 0 00-5.487 0c-.164-.398-.398-.775-.608-1.15a.074.074 0 00-.079-.037A19.789 19.789 0 003.683 4.37a.074.074 0 00-.032.027C.533 9.045-.319 13.579.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.074.074 0 00.081-.025c.454-.606.885-1.243 1.24-1.902a.074.074 0 00-.027-.098 13.087 13.087 0 01-1.872-.892.074.074 0 01-.008-.125c.126-.094.252-.192.378-.292a.074.074 0 01.078-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 01.078.01c.126.1.252.198.378.292a.074.074 0 01-.008.125 13.135 13.135 0 01-1.872.892.074.074 0 00-.027.098c.356.66.786 1.296 1.24 1.902a.074.074 0 00.081.025 19.884 19.884 0 006.002-3.03.074.074 0 00.032-.057c.5-5.177-.838-9.673-3.548-13.66a.074.074 0 00-.032-.027zM8.02 15.332c-1.183 0-2.157-1.085-2.157-2.419s.966-2.419 2.157-2.419c1.197 0 2.176 1.085 2.157 2.419 0 1.334-.96 2.419-2.157 2.419zm7.974 0c-1.183 0-2.157-1.085-2.157-2.419s.966-2.419 2.157-2.419c1.197 0 2.176 1.085 2.157 2.419 0 1.334-.96 2.419-2.157 2.419z" />
            </svg>
            <span class="text-lg font-semibold text-blue-700 dark:text-blue-300">Discord</span>
        </a>
        <!-- Telegram -->
        <a href="https://t.me/your-profile" target="_blank" rel="noopener noreferrer" aria-label="{{ t.social.telegram.aria }}"
            class="flex items-center gap-3 p-4 bg-white dark:bg-gray-800 rounded-lg shadow-md hover:shadow-xl hover:bg-blue-50 dark:hover:bg-blue-900 transition-all duration-300 transform hover:scale-105">
            <svg class="w-6 h-6 text-blue-500 dark:text-blue-300" viewBox="0 0 240 240" fill="currentColor"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M120,0C53.7,0,0,53.7,0,120s53.7,120,120,120s120-53.7,120-120S186.3,0,120,0z M174.5,76.5l-21.2,100.4c-1.6,7.2-5.8,9-11.8,5.6
        l-32.7-24.1l-15.8,15.2c-1.7,1.7-3.2,3.2-6.6,3.2l2.3-32.4l59.1-53.3c2.6-2.3-0.6-3.6-4-1.3L84.2,124.3l-31.3-9.8
        c-6.8-2.1-6.9-6.8,1.4-10.1l116.1-44.7C174.1,57.4,177.2,63.4,174.5,76.5z" />
            </svg>
            <span class="text-lg font-semibold text-blue-700 dark:text-blue-300">Telegram</span>
        </a>
        <!-- YouTube -->
        <a href="https://www.youtube.com/@MechardoLabs" target="_blank" rel="noopener noreferrer" aria-label="{{ t.social.youtube.aria }}"
            class="flex items-center gap-3 p-4 bg-white dark:bg-gray-800 rounded-lg shadow-md hover:shadow-xl hover:bg-blue-50 dark:hover:bg-blue-900 transition-all duration-300 transform hover:scale-105">
            <svg class="w-6 h-6 text-blue-700 dark:text-blue-300" fill="currentColor" viewBox="0 0 24 24"
                aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M21.582 6.186c-.23-.66-.873-1.17-1.55-1.24C18.345 4.736 12 4.736 12 4.736s-6.345 0-8.032.21c-.677.07-1.32.58-1.55 1.24C2.21 7.873 2 10.685 2 12s0 4.127.218 5.814c.23.66.873 1.17 1.55 1.24 1.687.21 8.032.21 8.032.21s6.345 0 8.032-.21c.677-.07 1.32-.58 1.55-1.24C21.79 16.127 22 13.315 22 12s0-4.127-.218-5.814zM10 15.36v-6.72l5.262 3.36-5.262 3.36z" />
            </svg>
            <span class="text-lg font-semibold text-blue-700 dark:text-blue-300">YouTube</span>
        </a>
    </div>

    <!-- Contact form -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-bold text-blue-600 dark:text-blue-300 mb-6 text-center">{{ t.contact.form.title }}</h2>
        <form method="POST" action="/{{ lang | default(value='es') }}/contact"
            data-success-url="/{{ lang | default(value='es') }}/contact_success"
            data-recaptcha-key="{{ recaptcha_site_key }}"
            data-error-unknown="{{ t.errors.contact_unknown }}"
            data-error-submit="{{ t.errors.contact_submit }}"
            data-error-recaptcha="{{ t.errors.recaptcha_failed }}"
            data-sending="{{ t.contact.form.sending }}"
            class="space-y-4" id="contact-form">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">{{ t.contact.form.name }}</label>
                <input type="text" id="name" name="name" value="{{ name | default(value='') }}" maxlength="100"
                    autocomplete="name"
                    class="mt-1 w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors duration-200 autofill:bg-transparent"
                    placeholder="{{ t.contact.form.name_placeholder }}" required>
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300">{{ t.contact.form.email }}</label>
                <input type="email" id="email" name="email" value="{{ email | default(value='') }}" maxlength="254"
                    autocomplete="email"
                    class="mt-1 w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors duration-200 autofill:bg-transparent"
                    placeholder="{{ t.contact.form.email_placeholder }}" required>
            </div>
            <div>
                <label for="message" class="block text-sm font-medium text-gray-700 dark:text-gray-300">{{ t.contact.form.message }}</label>
                <textarea id="message" name="message" rows="4" maxlength="5000"
                    class="mt-1 w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors duration-200 autofill:bg-white dark:autofill:bg-gray-700"
                    placeholder="{{ t.contact.form.message_placeholder }}" required>{{ message | default(value='') }}</textarea>
            </div>
            <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response">
            <div id="error-alert" role="alert" aria-live="assertive"
                class="hidden p-4 bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-100 rounded-lg shadow-md">
                <span id="error-message"></span>
            </div>
            <div class="text-center">
                <button type="submit" id="contact-submit"
                    class="px-6 py-3 bg-blue-600 text-white rounded-lg shadow-md hover:bg-blue-700 dark:bg-blue-600 dark:hover:bg-blue-700 transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none">{{
                    t.contact.form.submit }}</button>
            </div>
        </form>
    </div>
</div>
<!-- reCAPTCHA v3 script -->
<script src="https://www.google.com/recaptcha/api.js?render={{ recaptcha_site_key }}"></script>
<script src="/static/js/contact.js" defer></script>
{% endblock %}
