name: Build Docker Image

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          make build-image

      - name: Run Docker container
        run: |
          make run-image
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ -z "$healthy" ]; then
            docker logs mechardo3d
            make stop-image
            exit 1
          fi
          # Every page renders: a Tera failure would answer 500 here.
          for path in /es /en /es/me /es/blog /es/blog/4 /en/blog/4 /es/ds2000 \
                      /es/ds2000/terms-of-service /es/ds2000/privacy-policy /es/contact \
                      /es/contact_success /sitemap.xml /robots.txt; do
            echo "GET $path"
            curl -fsS -o /dev/null "http://localhost:3000$path" || { docker logs mechardo3d; make stop-image; exit 1; }
          done
          # And the 404 page is a 404, not a redirect loop.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/es/no-existe)
          if [ "$status" != "404" ]; then
            echo "expected 404 for /es/no-existe, got $status"
            docker logs mechardo3d; make stop-image; exit 1
          fi
          make stop-image
