name: Build Docker Image

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          make build-image

      - name: Run Docker container
        run: |
          make run-image
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ -z "$healthy" ]; then
            docker logs mechardo3d
            make stop-image
            exit 1
          fi
          curl -fsS -o /dev/null http://localhost:3000/es
          curl -fsS -o /dev/null http://localhost:3000/en/blog
          curl -fsS -o /dev/null http://localhost:3000/sitemap.xml
          make stop-image
