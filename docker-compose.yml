services:
  mechardo3d:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
    networks:
      - proxy
    volumes:
      - ./data:/usr/local/bin/data
      - ./secrets:/usr/local/bin/secrets

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mechardo3d
      - plausible
    networks:
      - proxy

  plausible_db:
    image: postgres:15
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
    networks:
      - proxy

  plausible_clickhouse:
    image: clickhouse/clickhouse-server:24.3.3.102-alpine
    restart: always
    volumes:
      - event-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_DB=plausible_events_db
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxy

  plausible_mail:
    image: bytemark/smtp
    restart: always
    networks:
      - proxy

  plausible:
    image: ghcr.io/plausible/community-edition:v3.0.1
    restart: always
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_clickhouse:
        condition: service_healthy
      plausible_db:
        condition: service_started
      plausible_mail:
        condition: service_started
    env_file:
      - ./secrets/plausible.env
    environment:
      - DATABASE_URL=postgres://postgres:postgres@plausible_db:5432/plausible
      - CLICKHOUSE_DATABASE_URL=http://plausible_clickhouse:8123/plausible_events_db
    ports:
      - "8000:8000"
    networks:
      - proxy

networks:
  proxy:

volumes:
  caddy_data:
  caddy_config:
  data:
  db-data:
  event-data:
  clickhouse-logs:
