services:
  mechardo3d:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Only reachable through Caddy; not published on the host.
    expose:
      - "3000"
    env_file:
      - ./secrets/recaptcha.env
    environment:
      - RUST_LOG=info
      - BASE_URL=https://mechardo3d.xyz
      - COOKIE_SECURE=true
      - TRUST_PROXY_HEADERS=true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - proxy
    volumes:
      - ./data:/usr/local/bin/data
      - ./secrets:/usr/local/bin/secrets

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mechardo3d
      - plausible
    networks:
      - proxy

  plausible_db:
    image: postgres:15
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    # POSTGRES_PASSWORD lives in the secrets file, not in this repo.
    env_file:
      - ./secrets/plausible-db.env
    networks:
      - proxy

  plausible_clickhouse:
    image: clickhouse/clickhouse-server:24.3.3.102-alpine
    restart: always
    volumes:
      - event-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_DB=plausible_events_db
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - proxy

  plausible:
    image: ghcr.io/plausible/community-edition:v3.0.1
    restart: always
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      - plausible_db
      - plausible_clickhouse
    # DATABASE_URL carries the database password, so it is set in
    # secrets/plausible.env alongside the rest of Plausible's configuration.
    env_file:
      - ./secrets/plausible.env
    environment:
      - CLICKHOUSE_DATABASE_URL=http://plausible_clickhouse:8123/plausible_events_db
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - proxy

networks:
  proxy:

volumes:
  caddy_data:
  caddy_config:
  data:
  db-data:
  event-data:
  clickhouse-logs:
